<!DOCTYPE html>
<html lang="ko" class="type2">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>통계 카드 시안 데모</title>
<link rel="stylesheet" href="../style.css">
<style>
  /* sian.html 의 "통계 카드 묶기(type2)" 에 iframe 으로 들어가는 데모다.
     ?v=a|b|c 로 안을 고른다. 앱 CSS 를 그대로 쓰고 안마다 다른 점만 얹는다. */
  body{min-height:0;}
  body::after{display:none;}
  .main{padding:26px 28px;}
  .main::before, .main::after{display:none;}
  .summary-row{margin:0;}

  /* B · 판 하나 — 타일은 그림자·그라데이션을 버리고 옅은 단색 면 */
  .v-b .overview-box, .v-c .overview-box{display:flex;flex-direction:column;padding:22px 24px;border-radius:var(--r-lg);background:var(--card-bg);box-shadow:var(--shadow-clay);}
  .v-b .overview-box .panel-title, .v-c .overview-box .panel-title{margin-bottom:14px;}
  .v-b .overview, .v-c .overview{flex:1;gap:14px;}
  .v-b .stat, .v-c .stat{box-shadow:none;background:var(--accent-soft);border-radius:var(--r-md);}
  .v-b .stat{padding:18px 20px;}

  /* C · 참고 화면처럼 — 아이콘은 오른쪽 위 작은 선, 글은 왼쪽 정렬 */
  .v-c .stat{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding:18px 20px;}
  .v-c .stat-icon{position:absolute;top:16px;right:16px;width:30px;height:30px;padding:5px;border:1.5px solid color-mix(in srgb, var(--accent-ink) 45%, transparent);border-radius:9px;color:var(--accent-ink);background:transparent;}
  .v-c .stat-value{order:1;font-size:1.7rem;text-align:left;}
  .v-c .stat.primary .stat-value{font-size:1.6rem;}
  .v-c .stat-title{order:2;text-align:left;}
  .v-c .stat-line{order:1;flex-direction:row;justify-content:flex-start;align-items:baseline;gap:4px 10px;}
  .v-c .stat-line .stat-value{order:0;}
</style>
</head>
